[workspace]
resolver = "3"
members = [
    "crates/pokerbot-core",
    "crates/pokerbot-cfr",
    "crates/pokerbot-cli",
    "crates/pokerbot-analysis",
    "crates/pokerbot-eval",
    "crates/pokerbot-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["pokerbot contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
